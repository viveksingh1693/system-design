global:
  scrape_interval: 5s

scrape_configs:

  - job_name: business-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - business-service:8080
        labels:
          application: business-service
          environment: local

  - job_name: proximity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - proximity-service:8080
        labels:
          application: proximity-service
          environment: local