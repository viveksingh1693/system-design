server:
  port: 8081

debug: true

logging:
  level:
    org.flywaydb: TRACE
    db.migration: TRACE
    root: DEBUG

spring:
  application:
    name: nearby-service

  datasource:
    url: jdbc:postgresql://localhost:5432/nearby
    username: nearby
    password: nearby
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics